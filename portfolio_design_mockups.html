    /* Custom styling for the 6 distinct portfolio templates */
    * { box-sizing: border-box; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    /* Dot grid pattern for Scrapbook template */
    .scrapbook-bg {
      background-color: #FFFDF7;
      background-image: radial-gradient(#D7CCC8 1.25px, transparent 1.25px);
      background-size: 20px 20px;
    }

    /* Washi tape effect */
    .washi-tape {
      width: 96px;
      height: 24px;
      background: rgba(224, 109, 83, 0.28);
      border-left: 2px dashed rgba(224, 109, 83, 0.45);
      border-right: 2px dashed rgba(224, 109, 83, 0.45);
      transform: rotate(-2.5deg);
    }
    .washi-tape-mint {
      width: 90px;
      height: 22px;
      background: rgba(74, 155, 142, 0.26);
      border-left: 2px dashed rgba(74, 155, 142, 0.45);
      border-right: 2px dashed rgba(74, 155, 142, 0.45);
      transform: rotate(2deg);
    }

    /* Device Frame Transitions */
    .viewport-container {
      transition: max-width 0.35s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s ease;
    }

    /* Mobile Frame styling */
    .mobile-frame {
      max-width: 390px !important;
      margin: 0 auto;
      border: 10px solid #1E293B;
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      position: relative;
    }
    .mobile-notch {
      width: 120px;
      height: 22px;
      background: #1E293B;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      margin: 0 auto;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    /* A4 PDF Page styling */
    .pdf-frame {
      max-width: 794px !important;
      margin: 0 auto;
      background: #E2E8F0;
      padding: 24px;
      border-radius: 12px;
    }
    .a4-sheet {
      background: #FFFFFF;
      color: #0F172A;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      padding: 40px 44px;
      margin-bottom: 24px;
      border: 1px solid #CBD5E1;
      position: relative;
    }
  </style>

    function renderTabs() {
      const container = document.getElementById("template-tabs");
      container.innerHTML = templates.map(t => {
        const active = t.id === currentTemplate;
        return `
          <button onclick="selectTemplate('${t.id}')"
            class="px-3.5 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-2 border ${
              active
                ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)] shadow-sm'
                : 'bg-[var(--background)] text-[var(--foreground)] border-[var(--border)] hover:bg-[var(--content)]'
            }">
            <span class="opacity-80">${t.num}</span>
            <span>${t.id === 'overview' ? t.name : t.name}</span>
          </button>
        `;
      }).join("");
    }

    function renderInfoBar() {
      const t = templates.find(item => item.id === currentTemplate);
      const bar = document.getElementById("template-info-bar");
      const swatches = t.palette.map(c => `<span class="inline-block w-4 h-4 rounded-full border border-black/15" style="background:${c}" title="${c}"></span>`).join("");

      bar.innerHTML = `
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex flex-wrap items-center gap-2">
            <span class="px-2 py-0.5 rounded font-bold bg-[var(--primary)]/15 text-[var(--foreground)]">${t.num} · ${t.badge}</span>
            <span class="font-semibold text-[var(--foreground)]">${t.name}</span>
            <span class="text-[var(--muted-foreground)] hidden sm:inline">— ${t.tagline}</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1" title="시안 컬러 팔레트">
              <span class="text-[var(--muted-foreground)] mr-1">컬러칩:</span>
              ${swatches}
            </div>
            <span class="text-[var(--muted-foreground)] hidden md:inline">추천: <strong class="text-[var(--foreground)]">${t.target}</strong></span>
          </div>
        </div>
      `;
    }

    function setViewport(vp) {
      currentViewport = vp;
      ['desktop', 'mobile', 'pdf'].forEach(mode => {
        const btn = document.getElementById(`vp-${mode}`);
        if (mode === vp) {
          btn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 bg-[var(--primary)] text-[var(--primary-foreground)]";
        } else {
          btn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 text-[var(--muted-foreground)] hover:text-[var(--foreground)]";
        }
      });
      renderPreview();
    }

    function selectTemplate(id) {
      currentTemplate = id;
      renderTabs();
      renderInfoBar();
      renderPreview();
    }

    function filterWorks() {
      if (activeSubjectFilter === "전체") return portfolioWorks;
      return portfolioWorks.filter(w => w.subject === activeSubjectFilter);
    }

    function setSubjectFilter(subj) {
      activeSubjectFilter = subj;
      renderPreview();
    }

    function openWorkModal(id) {
      const w = portfolioWorks.find(item => item.id === id);
      if (!w) return;
      const modal = document.getElementById("detail-modal");
      const body = document.getElementById("modal-body");
      body.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <span class="px-2.5 py-1 rounded-full text-xs font-bold text-white" style="background:${w.color}">${w.subject} · ${w.semester}</span>

      const subjects = ["전체", "국어", "수학", "과학", "사회", "미술", "정보"];
      return `
        <div class="flex items-center gap-1.5 flex-wrap">
          ${subjects.map(s => {
            const isSel = activeSubjectFilter === s;
            return `<button onclick="setSubjectFilter('${s}')"

          }).join("")}

                </div>
                <h2 class="text-xl md:text-2xl font-bold text-white leading-snug">${currentWork.title}</h2>

                  ${currentWork.reflection}

                <div class="flex flex-wrap gap-2 pt-1">

    function prevSlide(len) {
      showcaseIndex = (showcaseIndex - 1 + len) % len;
      renderPreview();
    }
    function nextSlide(len) {
      showcaseIndex = (showcaseIndex + 1) % len;
      renderPreview();
    }
    function setSlide(idx) {
      showcaseIndex = idx;
      renderPreview();
    }

    // ==========================================
    // PDF Print Layout Preview (A4 Pages)
    // ==========================================
    function renderPdfPrintView() {
      const t = templates.find(item => item.id === currentTemplate) || templates[1];
      const accent = t.palette[2] || "#1E3A5F";
      return `
        <div class="space-y-4">
          <div class="bg-white text-slate-800 px-4 py-3 rounded-xl border border-slate-300 flex flex-wrap items-center justify-between gap-2 text-xs shadow-sm">
            <div>
              <strong>🖨️ PDF 인쇄 출력물 미리보기 (${t.name} 스타일 적용)</strong> — A4 규격 표지 + 목차 + 교과별 결과물이 페이지 잘림 없이 자동 조판됩니다.
            </div>
            <span class="px-2.5 py-1 rounded bg-slate-900 text-white font-semibold">A4 (210 × 297mm)</span>
          </div>

          <!-- Page 1: Cover & Table of Contents -->
          <div class="a4-sheet rounded-lg">
            <div class="border-b-4 pb-6 mb-6" style="border-color:${accent}">
              <div class="text-xs font-bold uppercase tracking-widest" style="color:${accent}">STUDENT PORTFOLIO ARCHIVE · ${studentProfile.year}</div>
              <h1 class="text-3xl font-extrabold text-slate-900 mt-2">${studentProfile.portfolioTitle}</h1>
              <p class="text-sm text-slate-600 mt-1">${studentProfile.subtitle}</p>
              <div class="mt-4 flex gap-6 text-xs text-slate-700">
                <span><strong>학교/학년:</strong> ${studentProfile.schoolInfo}</span>
                <span><strong>이름:</strong> ${studentProfile.studentName}</span>
                <span><strong>양식 테마:</strong> ${t.name}</span>
              </div>
            </div>

            <div class="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
              <div class="text-xs font-bold mb-1" style="color:${accent}">나의 소개 (Introduction)</div>
              <p class="text-xs text-slate-700 leading-relaxed">${studentProfile.introText}</p>
            </div>

            <div class="mb-6">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">목차 (Table of Contents)</div>
              <div class="border-t border-slate-200 divide-y divide-slate-200 text-xs">
                ${portfolioWorks.map((w, i) => `
                  <div class="py-2 flex items-center justify-between">
                    <span><strong>0${i + 1}. [${w.subject}]</strong> ${w.title}</span>
                    <span class="text-slate-500">${w.semester} · p.0${i + 2}</span>
                  </div>
                `).join("")}
              </div>
            </div>

            <!-- Sample First 2 Works on Page 1/2 -->
            <div class="space-y-4 pt-2 border-t border-slate-200">
              <div class="text-xs font-bold uppercase tracking-wider" style="color:${accent}">교과별 상세 결과물 (본문 조판 예시)</div>
              ${portfolioWorks.slice(0, 2).map((w, i) => `
                <div class="border border-slate-300 rounded-lg p-4 grid grid-cols-12 gap-4 items-center">
                  <div class="col-span-4 rounded overflow-hidden border border-slate-200">
                    ${getWorkSvg(w.svgType, "h-28")}
                  </div>
                  <div class="col-span-8 space-y-1.5 text-xs">
                    <div class="font-bold" style="color:${accent}">0${i + 1}. [${w.subject} · ${w.semester}] ${w.title}</div>
                    <p class="text-slate-700 leading-relaxed">${w.summary}</p>
                    <p class="text-slate-600 italic"><strong>성찰:</strong> ${w.reflection}</p>
                  </div>
                </div>
              `).join("")}
            </div>
            <div class="mt-6 pt-3 border-t border-slate-200 flex justify-between text-xs text-slate-400">
              <span>${studentProfile.schoolInfo} ${studentProfile.studentName}</span>
              <span>Page 1 of 3</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderPreview() {
      const wrapper = document.getElementById("preview-wrapper");
      const isMobile = currentViewport === "mobile";

      // Reset wrapper classes
      wrapper.className = "viewport-container mx-auto ";
      if (currentViewport === "mobile") {
        wrapper.classList.add("mobile-frame");
      } else if (currentViewport === "pdf") {
        wrapper.classList.add("pdf-frame");
      } else {
        wrapper.classList.add("max-w-6xl");
      }

      if (currentViewport === "pdf") {
        wrapper.innerHTML = renderPdfPrintView();
        return;
      }

      let innerHtml = "";
      if (currentTemplate === "overview") innerHtml = renderOverview();
      else if (currentTemplate === "editorial") innerHtml = renderEditorial(isMobile);
      else if (currentTemplate === "gallery") innerHtml = renderGallery(isMobile);
      else if (currentTemplate === "timeline") innerHtml = renderTimeline(isMobile);
      else if (currentTemplate === "academic") innerHtml = renderAcademic(isMobile);
      else if (currentTemplate === "scrapbook") innerHtml = renderScrapbook(isMobile);
      else if (currentTemplate === "showcase") innerHtml = renderShowcase(isMobile);

      if (isMobile) {
        wrapper.innerHTML = `<div class="mobile-notch"></div><div class="p-2">${innerHtml}</div>`;
      } else {
        wrapper.innerHTML = innerHtml;
      }
    }

    // Initialize Studio
    renderTabs();
    renderInfoBar();
    renderPreview();
  </script>
</body>
</html>
