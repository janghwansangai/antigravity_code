  <script>
    // Pure-JS ZIP Generator
    const CRC_TABLE = (() => {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        table[i] = c >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    function createZipBlob(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      for (const file of files) {
        const nameBytes = encoder.encode(file.path);
        const dataBytes = typeof file.content === 'string' ? encoder.encode(file.content) : file.content;
        const crc = crc32(dataBytes);
        const size = dataBytes.length;

        const localHeader = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(localHeader.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(6, 0x0800, true);
        lv.setUint16(8, 0, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, size, true);
        lv.setUint32(22, size, true);
        lv.setUint16(26, nameBytes.length, true);
        localHeader.set(nameBytes, 30);
        localParts.push(localHeader, dataBytes);

        const centralHeader = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(centralHeader.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0x0800, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, size, true);
        cv.setUint32(24, size, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint32(42, offset, true);
        centralHeader.set(nameBytes, 46);
        centralParts.push(centralHeader);
        offset += localHeader.length + size;
      }
      const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
      const eocd = new Uint8Array(22);
      const ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, files.length, true);
      ev.setUint16(10, files.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, offset, true);
      return new Blob([...localParts, ...centralParts, eocd], { type: 'application/zip' });
    }

    function dataUrlToUint8Array(dataUrl) {
      const comma = dataUrl.indexOf(',');
      const header = dataUrl.slice(0, comma);
      const body = dataUrl.slice(comma + 1);
      if (header.includes(';base64')) {
        const binary = atob(body);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }
      return new TextEncoder().encode(decodeURIComponent(body));
    }

      art: makeSvgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280"><rect width="500" height="280" fill="#FDE68A"/><path d="M95 215 A155 140 0 0 1 405 215 Z" fill="#FFF" stroke="#475569" stroke-width="2.5"/><circle cx="90" cy="190" r="35" fill="#3D6B58"/><circle cx="415" cy="185" r="40" fill="#2E5A48"/><rect y="215" width="500" height="65" fill="#334E43"/><text x="250" y="252" text-anchor="middle" fill="#FFFBEB" font-size="15" font-weight="700">🎨 [완성 작품] 내가 꿈꾸는 숲속 미래 도서관 일러스트</text></svg>`)

    // 9 Templates (Original 6 + 3 New Magazine Book Templates!)

    function esc(str = '') {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
    }

      editorTab = tab;
      renderEditor();

      state.selectedTemplate = tplId;
      renderEditor();
      renderPreview();
      const found = TEMPLATES.find(t => t.id === tplId);
      if (found) showToast(`🎨 '${found.name}' 디자인 양식이 적용되었습니다.`);
    }

    function deleteWork(id) {
      state.works = state.works.filter(w => w.id !== id);

      showToast('기록이 삭제되었습니다.');
    }

    function handleActivityPhotoUpload(inputEl) {
      const files = Array.from(inputEl.files || []);
      const cur = state.works.find(w => w.id === activeWorkId);
      if (!cur || !files.length) return;
      if (!cur.activityPhotos) cur.activityPhotos = [];
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          cur.activityPhotos.push({
            id: 'ap_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
            name: file.name,
            caption: file.name.replace(/\.[^.]+$/, '') + ' 활동 모습',
            dataUrl: reader.result
          });
          loaded++;
          if (loaded === files.length) {
            renderEditor();
            renderPreview();
            showToast(`📸 학생 활동 사진 ${files.length}장이 추가되었습니다.`);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function handleImageUpload(inputEl) {
      const files = Array.from(inputEl.files || []);
      const cur = state.works.find(w => w.id === activeWorkId);
      if (!cur || !files.length) return;
      let loaded = 0;

        reader.onload = () => {
          cur.images.push({
            id: 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
            name: file.name,

          loaded++;
          if (loaded === files.length) {
            renderEditor();
            renderPreview();
            showToast(`🎨 완성 작품·결과물 이미지 ${files.length}장이 추가되었습니다.`);

        };
        reader.readAsDataURL(file);
      });
    }

    function handleFileUpload(inputEl) {
      const files = Array.from(inputEl.files || []);
      const cur = state.works.find(w => w.id === activeWorkId);
      if (!cur || !files.length) return;
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          cur.attachments.push({
            id: 'att_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
            name: file.name,
            size: Math.max(1, Math.round(file.size / 1024)) + ' KB',
            dataUrl: reader.result
          });
          loaded++;
          if (loaded === files.length) {
            renderEditor();
            renderPreview();
            showToast(`📎 첨부파일 ${files.length}개가 추가되었습니다.`);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    // Build Portfolio Inner HTML
    function buildPortfolioInnerHtml(assetMap = null, isMobile = false) {
      const tpl = TEMPLATES.find(t => t.id === state.selectedTemplate) || TEMPLATES[0];
      const p = state.profile;
      const allWorks = state.works;

      // Filter works by Track / Subject / Project
      let works = allWorks;
      if (filterMode === '🚀 프로젝트 모음') {
        works = allWorks.filter(w => w.entryType === 'project');
      } else if (filterMode === '📚 교과별 모음') {
        works = allWorks.filter(w => w.entryType !== 'project');
      } else if (filterMode !== '전체' && filterMode !== '📸 활동사진첩') {
        works = allWorks.filter(w => w.subject === filterMode || w.projectName === filterMode);
      }

      const subjectTags = [...new Set(allWorks.map(w => w.subject).filter(Boolean))];
      const filterPills = ['전체', '🚀 프로젝트 모음', '📚 교과별 모음', '📸 활동사진첩', ...subjectTags];

      const filterBar = `
        <div class="flex flex-wrap gap-1.5">
          ${filterPills.map(f => `
            <button onclick="filterMode='${esc(f)}';renderPreview()" style="${
              filterMode === f ? `background:${tpl.accent};color:#FFF;` : 'background:rgba(128,128,128,0.14);'
            }" class="px-3 py-1 rounded-full text-xs font-bold transition-all">${esc(f)}</button>
          `).join('')}
        </div>
      `;

      // Dedicated Activity Photo Album View when '📸 활동사진첩' is selected!
      if (filterMode === '📸 활동사진첩') {
        const allPhotos = [];
        allWorks.forEach(w => {
          (w.activityPhotos || []).forEach(ap => {
            const src = assetMap && assetMap.activityPhotos?.[ap.id] ? assetMap.activityPhotos[ap.id] : ap.dataUrl;
            allPhotos.push({
              src,
              caption: ap.caption,
              badge: w.entryType === 'project' ? `🚀 ${w.projectName}` : `📚 ${w.subject}`,
              semester: w.semester,
              workTitle: w.title
            });
          });
        });

        return `
          <div style="background:${tpl.bg};color:${tpl.text};" class="rounded-2xl overflow-hidden border border-stone-300 shadow-md p-6">
            <div class="pb-4 mb-6 border-b border-current/15">
              <div class="text-xs font-bold uppercase tracking-wider" style="color:${tpl.accent}">STUDENT ACTIVITY PHOTO ARCHIVE · 1년의 활동 스냅 사진첩</div>
              <h1 class="text-2xl md:text-3xl font-extrabold mt-1">📸 ${esc(p.studentName)}의 교실 & 프로젝트 현장 사진첩</h1>
              <p class="text-xs opacity-80 mt-1">교과 수업과 프로젝트 현장에서 친구들과 함께 탐구하고 발표하며 기록한 생생한 활동 사진 모음입니다.</p>
              <div class="mt-4">${filterBar}</div>
            </div>
            <div class="grid grid-cols-1 ${isMobile ? '' : 'md:grid-cols-2'} gap-5">
              ${allPhotos.map((ph, idx) => `
                <div class="rounded-xl overflow-hidden border border-current/15 bg-white text-slate-900 shadow-sm">
                  <img src="${ph.src}" class="w-full h-52 object-cover" />
                  <div class="p-4">
                    <div class="flex items-center justify-between text-xs mb-1">
                      <span class="px-2 py-0.5 rounded text-white font-bold" style="background:${tpl.accent}">SNAP #0${idx + 1} · ${esc(ph.badge)}</span>
                      <span class="text-slate-500">${esc(ph.semester)}</span>
                    </div>
                    <div class="font-bold text-sm text-slate-900 mt-1">${esc(ph.caption)}</div>
                    <div class="text-xs text-slate-500 mt-1">연계 활동: ${esc(ph.workTitle)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Helper to render Category Badge (Project vs Subject), Activity Photos, Result Images, and Attachments
      const renderMedia = (w) => {
        const badgeHtml = w.entryType === 'project'
          ? `<div class="flex flex-wrap items-center gap-1.5 mb-1.5">
              <span class="px-2.5 py-0.5 rounded text-xs font-extrabold text-white" style="background:${tpl.accent}">🚀 프로젝트 · ${esc(w.projectName || '융합탐구')}</span>
              ${w.linkedSubjects ? `<span class="px-2 py-0.5 rounded text-xs font-bold bg-black/10">${esc(w.linkedSubjects)}</span>` : ''}
              ${w.projectRole ? `<span class="text-xs opacity-75">역할: ${esc(w.projectRole)}</span>` : ''}
            </div>`
          : `<div class="flex flex-wrap items-center gap-1.5 mb-1.5">
              <span class="px-2.5 py-0.5 rounded text-xs font-extrabold text-white" style="background:${tpl.accent}">📚 ${esc(w.subject)} 교과</span>
              <span class="text-xs opacity-75">${esc(w.semester)} · ${esc(w.activityType)}</span>
            </div>`;

        const actPhotos = (w.activityPhotos || []).map(ap => {
          const src = assetMap && assetMap.activityPhotos?.[ap.id] ? assetMap.activityPhotos[ap.id] : ap.dataUrl;
          return `
            <figure class="rounded-xl overflow-hidden border-2 border-emerald-600/30 bg-emerald-50/40 my-2">
              <div class="px-2.5 py-1 bg-emerald-700 text-white text-xs font-bold flex items-center justify-between">
                <span>📸 학생 활동 사진 (현장 스냅)</span>
                <span class="opacity-80">${esc(w.semester)}</span>
              </div>
              <img src="${src}" alt="${esc(ap.caption)}" class="w-full max-h-52 object-cover" />
              ${ap.caption ? `<figcaption class="text-xs text-center py-1.5 px-2 text-emerald-950 font-medium">${esc(ap.caption)}</figcaption>` : ''}
            </figure>
          `;
        }).join('');

        const imgs = (w.images || []).map(img => {
          const src = assetMap && assetMap.images?.[img.id] ? assetMap.images[img.id] : img.dataUrl;
          return `
            <figure class="rounded-xl overflow-hidden border border-black/10 bg-white/90 my-2">
              <div class="px-2.5 py-1 bg-slate-800 text-white text-xs font-bold">🎨 완성 작품 · 결과물 자료</div>
              <img src="${src}" alt="${esc(img.caption)}" class="w-full max-h-52 object-cover" />
              ${img.caption ? `<figcaption class="text-xs text-center py-1.5 px-2 text-slate-700 font-medium">${esc(img.caption)}</figcaption>` : ''}
            </figure>
          `;
        }).join('');

        const dualPhotoGrid = (actPhotos && imgs)

              <div class="text-xs text-slate-700 mt-2 font-semibold">${esc(p.schoolInfo)} · ${esc(p.studentName)} (적용 테마: ${tpl.name})</div>
            </div>
            <div class="bg-slate-50 p-3.5 rounded-lg border border-slate-200 text-xs text-slate-700 mb-5">
              <strong>나의 소개:</strong> ${esc(p.introText)}
            </div>
            <div class="space-y-4">
              ${state.works.map((w, i) => `
                <div class="border border-slate-300 rounded-lg p-4 break-inside-avoid">
                  <div class="flex justify-between items-center border-b border-slate-200 pb-1.5 mb-2">
                    <span class="text-sm font-bold"><strong style="color:${tpl.accent}">0${i + 1}. [${w.entryType === 'project' ? '🚀 프로젝트: ' + esc(w.projectName) : '📚 교과: ' + esc(w.subject)}]</strong> ${esc(w.title)}</span>
                    <span class="text-xs text-slate-500">${esc(w.semester)}</span>
                  </div>
                  <div class="grid grid-cols-2 gap-2 my-2">
                    ${(w.activityPhotos || []).map(ap => `<div><div class="text-xs font-bold text-emerald-800 mb-0.5">📸 활동 사진</div><img src="${ap.dataUrl}" class="w-full max-h-36 object-cover rounded" /><div class="text-xs text-slate-500 mt-0.5">${esc(ap.caption)}</div></div>`).join('')}
                    ${(w.images || []).map(img => `<div><div class="text-xs font-bold text-slate-800 mb-0.5">🎨 결과물 자료</div><img src="${img.dataUrl}" class="w-full max-h-36 object-cover rounded" /><div class="text-xs text-slate-500 mt-0.5">${esc(img.caption)}</div></div>`).join('')}
                  </div>
                  <p class="text-xs text-slate-700 leading-relaxed">${esc(w.content)}</p>
                  <div class="mt-2 p-2 rounded bg-slate-50 border-l-4 text-xs text-slate-700" style="border-color:${tpl.accent}">
                    <strong>배우고 느낀 점:</strong> ${esc(w.reflection)}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        return;
      }

      if (previewMode === 'mobile') {
        stage.innerHTML = `
          <div class="mobile-shell">
            <div class="mobile-notch"></div>
            <div class="p-2">${buildPortfolioInnerHtml(null, true)}</div>
          </div>
        `;
        return;
      }

      stage.innerHTML = `<div class="max-w-4xl mx-auto">${buildPortfolioInnerHtml(null, false)}</div>`;
    }

    function downloadZipPackage() {
      const files = [];
      const assetMap = { activityPhotos: {}, images: {}, attachments: {} };

      state.works.forEach((w, wi) => {
        (w.activityPhotos || []).forEach((ap, pi) => {
          const ext = ap.dataUrl.includes('svg') ? 'svg' : 'png';
          const safeName = `${wi + 1}_act_${pi + 1}_${(ap.name || 'activity').replace(/[^a-zA-Z0-9가-힣._-]/g, '_')}`;
          const finalPath = `assets/activity_photos/${safeName.includes('.') ? safeName : safeName + '.' + ext}`;
          files.push({ path: finalPath, content: dataUrlToUint8Array(ap.dataUrl) });
          assetMap.activityPhotos[ap.id] = finalPath;
        });

        (w.images || []).forEach((img, ii) => {
          const ext = img.dataUrl.includes('svg') ? 'svg' : 'png';
          const safeName = `${wi + 1}_work_${ii + 1}_${(img.name || 'image').replace(/[^a-zA-Z0-9가-힣._-]/g, '_')}`;
          const finalPath = `assets/images/${safeName.includes('.') ? safeName : safeName + '.' + ext}`;
          files.push({ path: finalPath, content: dataUrlToUint8Array(img.dataUrl) });
          assetMap.images[img.id] = finalPath;
        });

        (w.attachments || []).forEach((att, ai) => {
          const safeName = `${wi + 1}_file_${ai + 1}_${(att.name || 'file.txt').replace(/[^a-zA-Z0-9가-힣._-]/g, '_')}`;
          const finalPath = `assets/attachments/${safeName}`;
          files.push({ path: finalPath, content: dataUrlToUint8Array(att.dataUrl) });
          assetMap.attachments[att.id] = finalPath;
        });
      });

      const bodyHtml = buildPortfolioInnerHtml(assetMap, false);
      const standaloneHtml = `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${esc(state.profile.portfolioTitle)} - ${esc(state.profile.studentName)}</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-slate-100 p-4 md:p-8">
  <div class="max-w-4xl mx-auto">${bodyHtml}</div>
</body>
</html>`;

      files.push({ path: 'index.html', content: standaloneHtml });
      files.push({ path: 'project-backup.json', content: JSON.stringify(state, null, 2) });

      const zipBlob = createZipBlob(files);
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(state.profile.studentName || '학생')}_포트폴리오_${state.selectedTemplate}.zip`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 400);
      showToast('📦 ZIP 압축 파일(index.html + activity_photos + images + attachments) 다운로드 완료!');
    }

    function exportPdfPrint() {
      previewMode = 'pdf';
      renderPreview();
      setTimeout(() => window.print(), 200);
    }

    // Initialize
    renderEditor();
    renderPreview();
  </script>
</body>
</html>
